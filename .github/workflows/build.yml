# Tests every push. A tag like v1.0.0 also builds the signed APK and publishes it as a release,
# and saves the signed app bundle for Google Play as a download on the run.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The version code is the commit count, so it needs the full history
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Test and build
        run: ./gradlew :core:test :app:assembleDebug --console=plain

      - name: Build signed APK and app bundle
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          I5_KEYSTORE_BASE64: ${{ secrets.I5_KEYSTORE_BASE64 }}
          I5_KEYSTORE_PASSWORD: ${{ secrets.I5_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$I5_KEYSTORE_BASE64" ] || [ -z "$I5_KEYSTORE_PASSWORD" ]; then
            echo "::error::The signing secrets aren't set. Run scripts/signing.sh github."
            exit 1
          fi
          export I5_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$I5_KEYSTORE_BASE64" | base64 -d > "$I5_KEYSTORE"
          ./gradlew :app:assembleRelease :app:bundleRelease -Pi5.versionName="${GITHUB_REF_NAME#v}" --console=plain
          rm "$I5_KEYSTORE"
          cp app/build/outputs/apk/release/app-release.apk "i5-express-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/bundle/release/app-release.aab "i5-express-$GITHUB_REF_NAME.aab"

      # For uploading to Google Play by hand. Kept off the release so nobody tries to install it.
      - name: Save app bundle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: play-bundle-${{ github.ref_name }}
          path: i5-express-${{ github.ref_name }}.aab
          retention-days: 90

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "i5-express-$GITHUB_REF_NAME.apk" \
            --title "I-5 Express $GITHUB_REF_NAME" --generate-notes
