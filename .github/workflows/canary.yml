name: Canary

# Started once a day by github.com/andrewmacheret/canary
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # A cold Lambda sometimes times out once, so try again before failing
      - name: Read the I-5 server
        env:
          I5_LIVE: "1"
        run: |
          ./gradlew :core:test --tests '*LiveStatusTest' --console=plain ||
            (sleep 30 && ./gradlew :core:test --tests '*LiveStatusTest' --rerun --console=plain)
